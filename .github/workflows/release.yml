name: Release Build (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos-arm
          - macos-intel
          - linux
          - all

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            id: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS (Apple Silicon)
            id: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS (Intel)
            id: macos-intel
            os: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            id: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
            artifact_path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    if: inputs.platform == matrix.id || inputs.platform == 'all'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.id }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 30
