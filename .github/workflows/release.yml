name: Release Build (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build and verify Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare pinned FFmpeg sidecars and notices
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          $expected = 'fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9'
          if ((Get-FileHash "$env:RUNNER_TEMP/ffmpeg.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $upstream = "$env:RUNNER_TEMP/ffmpeg/ffmpeg-9.0.1-essentials_build"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item "$upstream/bin/ffmpeg.exe" 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe'
          Copy-Item "$upstream/bin/ffprobe.exe" 'src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe'
          Copy-Item "$upstream/LICENSE" 'src-tauri/resources/ffmpeg/LICENSE'
          Copy-Item "$upstream/README.txt" 'src-tauri/resources/ffmpeg/README.txt'
          & "$upstream/bin/ffmpeg.exe" -version 2>&1 | Set-Content src-tauri/resources/ffmpeg/ffmpeg-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg version check failed' }
          & "$upstream/bin/ffmpeg.exe" -buildconf 2>&1 | Set-Content src-tauri/resources/ffmpeg/ffmpeg-buildconf.txt
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg build configuration check failed' }
          & "$upstream/bin/ffprobe.exe" -version 2>&1 | Set-Content src-tauri/resources/ffmpeg/ffprobe-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe version check failed' }

      - name: Check installer smoke script syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/smoke-windows-installers.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify frontend
        run: npm test
      - name: Build EXE and MSI installers
        run: npm run tauri build -- --bundles nsis,msi
      - name: Verify installed app and video tools
        run: ./scripts/smoke-windows-installers.ps1

      - name: Collect release files and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release/windows | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/windows/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/windows/
          Copy-Item "$env:RUNNER_TEMP/watermark-smoke-report.json" release/windows/SMOKE-TEST.json
          Compress-Archive -Path src-tauri/resources/ffmpeg/* -DestinationPath release/windows/FFmpeg-NOTICES.zip
          Get-ChildItem release/windows -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release/windows/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload verified Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release/windows/*
          if-no-files-found: error
          retention-days: 30
